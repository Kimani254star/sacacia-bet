<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acacia Bets — Activity Logs</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><style>body{font-family:Inter,Arial,sans-serif;background:#f4f7f6;color:#14251e;margin:0}.log-wrap{max-width:1050px;margin:32px auto;padding:20px}.log-head,.log-row{background:white;border:1px solid #e1e9e5;border-radius:12px;padding:16px;margin:10px 0}.log-head{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.log-row{display:grid;grid-template-columns:190px 1fr;gap:12px}.muted{color:#687b72;font-size:13px}button,a.btn{border:0;border-radius:8px;padding:10px 14px;background:#087f5b;color:white;text-decoration:none;cursor:pointer}button.danger{background:#b42318}@media(max-width:600px){.log-row{grid-template-columns:1fr}}</style><script src="acacia-appearance.js" data-app="bet"></script>
<link rel="stylesheet" href="acacia-stock-skin.css">
<script src="acacia-stock-shell.js" data-app="bet" data-icon="icon-192.png" defer></script>
</head><body><main class="log-wrap"><div class="log-head"><div><h1>Acacia Bets activity logs</h1><p class="muted">Actions recorded on this device. Form contents and passwords are never recorded.</p></div><div><a class="btn" href="index.html">Back to app</a> <button id="export">Export CSV</button> <button class="danger" id="clear">Clear logs</button></div></div><p id="count" class="muted"></p><section id="entries"></section></main><script src="audit-log.js"></script><script>const K='acaciaBetAuditLog';function load(){let a=[];try{a=JSON.parse(localStorage.getItem(K)||'[]')}catch{};document.getElementById('count').textContent=a.length+' events on this device';document.getElementById('entries').innerHTML=a.length?a.map(x=>`<article class="log-row"><div class="muted">${new Date(x.time).toLocaleString()}</div><div><b>${esc(x.action)}</b><div>${esc(x.detail||'')}</div></div></article>`).join(''):'<p>No activity recorded yet.</p>';window.rows=a}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}document.getElementById('export').onclick=()=>{const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const csv=['time,action,detail',...rows.map(x=>[x.time,x.action,x.detail].map(q).join(','))].join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='acacia-bets-activity-log.csv';a.click();URL.revokeObjectURL(a.href)};document.getElementById('clear').onclick=()=>{if(confirm('Clear all activity logs on this device?')){localStorage.removeItem(K);load()}};load();</script><script src="pwa-register.js" defer></script>  <script src="production-data-guard.js"></script>
</body></html>
